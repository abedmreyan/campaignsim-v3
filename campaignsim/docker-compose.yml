services:
  postgres:
    image: postgres:16-alpine
    container_name: campaignsim-postgres
    environment:
      POSTGRES_DB: campaignsim
      POSTGRES_USER: cs_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_user -d campaignsim"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  campaignsim:
    build: .
    container_name: campaignsim
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cs_user:${POSTGRES_PASSWORD:-cs_dev_password}@postgres:5432/campaignsim
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads

volumes:
  pgdata:
